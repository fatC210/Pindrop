    <circle cx="48" cy="39" r="16" fill="url(#logoPinCore)" />
    <circle cx="48" cy="39" r="7" fill="#CF4500" />
    <ellipse cx="41.5" cy="25.5" rx="9.5" ry="7" fill="#FFF4EE" opacity="0.42" />
    <path
      d="M48 84c7.4-6.4 22.2-21.9 27-38.4C71.3 55 61.4 65.7 48 76.4 34.6 65.7 24.7 55 21 45.6 25.8 62.1 40.6 77.6 48 84Z"
